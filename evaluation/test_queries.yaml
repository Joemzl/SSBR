# RAG 检索评估测试集
# 用于量化评估检索系统的准确性
#
# 标注规则：
# - relevant: 与查询直接相关的样本（必须出现）
# - acceptable: 可接受的相关样本（出现加分，不出现不扣分）
# - reason: 标注理由
#
# 评估指标：
# - Hit@K: Top-K 结果中是否包含 relevant 样本
# - Precision@K: Top-K 结果中 relevant + acceptable 的比例
# - MRR: 第一个 relevant 样本的排名倒数

version: "1.1"
created_at: "2026-03-07"
updated_at: "2026-03-07"
description: "SSBR 官能化方案推荐系统评估测试集（已移除空白对照样本）"

# ============================================================
# 测试用例
# ============================================================

test_cases:

  # ----------------------------------------------------------
  # 类别 1: 分散性相关查询
  # ----------------------------------------------------------
  - id: Q01
    query: "改善白炭黑分散性"
    category: "分散性"
    relevant:
      - SSBR-004  # 硅烷偶联，直接与白炭黑共价结合
      - SSBR-008  # 高羧基含量，强氢键作用
    acceptable:
      - SSBR-002  # 羟基，可形成氢键
      - SSBR-003  # 羧基，可形成氢键
      - SSBR-006  # 羧基官能化
      - SSBR-007  # 羧基官能化
    reason: "硅烷偶联和高极性官能团（羧基、羟基）有利于与白炭黑表面硅羟基相互作用"

  - id: Q02
    query: "提高填料-橡胶界面结合强度"
    category: "分散性"
    relevant:
      - SSBR-004  # 硅烷偶联，共价结合
      - SSBR-003  # 羧基+长链，界面强
      - SSBR-008  # 高Payne活化能，填料网络稳定
    acceptable:
      - SSBR-002  # 羟基改性
      - SSBR-006  # 羧基改性
      - SSBR-007  # 羧基改性
    reason: "Payne 效应活化能高说明填料网络稳定，界面结合强"

  # ----------------------------------------------------------
  # 类别 2: 动态性能相关查询
  # ----------------------------------------------------------
  - id: Q03
    query: "降低轮胎滚动阻力"
    category: "动态性能"
    relevant:
      - SSBR-016  # tan δ(60℃)=0.0734，最优
      - SSBR-017  # tan δ(60℃)=0.0788，优
      - SSBR-015  # tan δ(60℃)=0.0797，优
    acceptable:
      - SSBR-014  # tan δ(60℃)=0.0818，良
    reason: "tan δ(60℃) 越低，滚动阻力越小"

  - id: Q04
    query: "提高湿地抓地力"
    category: "动态性能"
    relevant:
      - SSBR-016  # tan δ(0℃)=0.9059，最优
      - SSBR-015  # tan δ(0℃)=0.8737，优
    acceptable:
      - SSBR-017  # tan δ(0℃)=0.8275，良
      - SSBR-014  # tan δ(0℃)=0.8190，良
    reason: "tan δ(0℃) 越高，湿地抓地力越好"

  - id: Q05
    query: "同时提高抓地力和降低滚阻"
    category: "动态性能"
    relevant:
      - SSBR-016  # 抓地 0.9059 + 滚阻 0.0734，双优
      - SSBR-015  # 抓地 0.8737 + 滚阻 0.0797，双优
    acceptable:
      - SSBR-017  # 综合性能良好
      - SSBR-014  # 综合性能良好
    reason: "需要同时满足高 tan δ(0℃) 和低 tan δ(60℃)"

  # ----------------------------------------------------------
  # 类别 3: 力学性能相关查询
  # ----------------------------------------------------------
  - id: Q06
    query: "提高拉伸强度"
    category: "力学性能"
    relevant:
      - SSBR-004  # 拉伸强度 21.5 MPa，最优
      - SSBR-003  # 拉伸强度 19.0 MPa，良
    acceptable:
      - SSBR-002  # 拉伸强度 17.5 MPa，良
    reason: "SSBR-004 的硅烷偶联显著提高了力学强度"

  - id: Q07
    query: "提高断裂伸长率和延展性"
    category: "力学性能"
    relevant:
      - SSBR-002  # 断裂伸长率 475%，最优
      - SSBR-003  # 断裂伸长率 430%，良
    acceptable:
      - SSBR-004  # 断裂伸长率 420%
    reason: "羟基改性保持了较好的延展性"

  # ----------------------------------------------------------
  # 类别 4: 热学性能相关查询
  # ----------------------------------------------------------
  - id: Q08
    query: "改善低温性能"
    category: "热学性能"
    relevant:
      - SSBR-006  # Tg = -26.7℃，低温性能优
      - SSBR-007  # Tg = -25.4℃
    acceptable:
      - SSBR-008  # Tg = -23.9℃
      - SSBR-010  # oxa-Michael 改性
      - SSBR-011  # oxa-Michael 改性
    reason: "Tg 越低，低温柔顺性越好"

  - id: Q09
    query: "提高玻璃化转变温度"
    category: "热学性能"
    relevant:
      - SSBR-004  # Tg = -5.5℃，最高
      - SSBR-003  # Tg = -7.0℃
      - SSBR-017  # Tg = -7.1℃
    acceptable:
      - SSBR-016  # Tg = -7.3℃
      - SSBR-015  # Tg = -7.5℃
    reason: "高 Tg 有利于高温性能和湿地抓地力"

  # ----------------------------------------------------------
  # 类别 5: Payne 效应相关查询
  # ----------------------------------------------------------
  - id: Q10
    query: "稳定填料网络结构"
    category: "Payne效应"
    relevant:
      - SSBR-008  # Ea = 17.7 kJ/mol，最优
      - SSBR-007  # Ea = 14.2 kJ/mol，良
    acceptable:
      - SSBR-006  # Ea = 12.8 kJ/mol，中
    reason: "Payne 效应活化能高说明填料网络更稳定"

  # ----------------------------------------------------------
  # 类别 6: 综合需求查询
  # ----------------------------------------------------------
  - id: Q11
    query: "绿色轮胎胎面胶配方"
    category: "综合"
    relevant:
      - SSBR-016  # 动态性能最优
      - SSBR-015  # 动态性能优
      - SSBR-004  # 力学性能优
    acceptable:
      - SSBR-003  # 综合性能良
      - SSBR-008  # Payne 效应优
      - SSBR-017  # 动态性能良
    reason: "绿色轮胎需要综合考虑滚阻、抓地力和力学性能"

  - id: Q12
    query: "羧基官能化改性方案"
    category: "综合"
    relevant:
      - SSBR-003  # 羧基，Gao_2019
      - SSBR-006  # 羧基，Qu_2014
      - SSBR-007  # 羧基，Qu_2014
      - SSBR-008  # 羧基，Qu_2014
      - SSBR-014  # 羧基，Wang_2018
      - SSBR-015  # 羧基，Wang_2018
      - SSBR-016  # 羧基，Wang_2018
      - SSBR-017  # 羧基，Wang_2018
    acceptable: []
    reason: "直接查询特定官能团类型"

